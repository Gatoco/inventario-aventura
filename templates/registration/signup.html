{% extends "base_login.html" %}

{% block title %} SIGNUP {% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="p-5">
            <div class="text-center">
                <h1 class="h4 text-gray-900 mb-4">¡Crear cuenta!</h1>
            </div>

            {% for field in form %}{% for error in field.errors %}<div class="alert alert-danger"><strong>{{ field.label }}:</strong> {{ error }}</div>{% endfor %}{% endfor %}

            <form class="user" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <input type="text" class="form-control form-control-user" id="id_username" name="username"
                        placeholder="Nombre de usuario..." autofocus required>
                </div>
                <div class="form-group row">
                    <div class="col-sm-6 mb-3 mb-sm-0">
                        <input type="password" class="form-control form-control-user" id="id_password1" name="password1"
                            placeholder="Contraseña...">
                    </div>
                    <div class="col-sm-6 mb-3 mb-sm-0">
                        <input type="password" class="form-control form-control-user" id="id_password2" name="password2"
                            placeholder="Repetir contraseña...">
                    </div>

                </div>
                <div class="form-group">
                    <div class="custom-control custom-checkbox small">
                        <input type="checkbox" class="custom-control-input" id="customCheck">
                        <label class="custom-control-label" for="customCheck">Recuerdame</label>
                    </div>
                </div>
                <button class="btn btn-primary btn-user btn-block" type="submit">
                    Registrar cuenta
                </button>
            </form>
            <hr>
            <div class="text-center">
                <a class="small" href="{% url 'password_reset' %}">¿Haz olvidado tu contraseña?</a>
            </div>
            <div class="text-center">
                <a class="small" href="{% url 'login' %}">¡Login!</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
