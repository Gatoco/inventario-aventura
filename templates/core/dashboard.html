{% extends 'base_panel.html' %}
{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">Hola, {{ user.get_full_name|default:user.username }}</h1>
<div class="row">
    {% for nombre, total in datos.items %}
    <div class="col-md-4 mb-4">
        <div class="card border-left-success shadow py-2"><div class="card-body">
            <div class="text-xs font-weight-bold text-success text-uppercase mb-1">{{ nombre }}</div>
            <div class="h3 mb-0 font-weight-bold text-gray-800">{{ total }}</div>
        </div></div>
    </div>
    {% endfor %}
</div>
{% endblock %}
